name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type check with mypy
        run: mypy src/ || true

      - name: Test with pytest + coverage
        run: |
          python -m pytest tests/ -v --tb=short --cov=cocapn_health --cov-report=term-missing --cov-fail-under=75

      - name: Check CLI works
        run: |
          cocapn-health --format oneline --system

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check syntax
        run: |
          python -m py_compile src/cocapn_health/__init__.py
          python -m py_compile src/cocapn_health/cli.py
          python -m py_compile src/cocapn_health/api.py
          python -m py_compile src/cocapn_health/sunset_bridge.py
          python -m py_compile src/cocapn_health/monitor.py
          python -m py_compile src/cocapn_health/alert.py
          python -m py_compile src/cocapn_health/report.py
          python -m py_compile src/cocapn_health/check.py
      - name: Lint with ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/
