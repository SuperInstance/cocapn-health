[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cocapn-health"
version = "1.0.0"
description = "Lightweight fleet service health checker — zero dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Cocapn Fleet", email = "fleet@cocapn.ai"}
]

[project.scripts]
cocapn-health = "cocapn_health.cli:main"

[project.urls]
Homepage = "https://github.com/SuperInstance/cocapn-health"
Repository = "https://github.com/SuperInstance/cocapn-health"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
