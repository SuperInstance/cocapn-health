[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cocapn-health"
version = "2.0.0"
description = "Fleet service health checker with HTTP/TCP/DNS/system checks and REST API — zero dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Cocapn Fleet", email = "fleet@cocapn.ai"}
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
cocapn-health = "cocapn_health.cli:main"

[project.urls]
Homepage = "https://github.com/SuperInstance/cocapn-health"
Repository = "https://github.com/SuperInstance/cocapn-health"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 127
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/cocapn_health"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 1
skip_covered = false
show_missing = true
fail_under = 75

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", ".pytest_cache"]
