services:
  health-checker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cocapn-health:latest
    container_name: cocapn-health
    environment:
      - COCAPN_HEALTH_HOST=<BOAT_IP>
    command: ["--format", "md", "--system", "--watch", "60", "--fail"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cocapn-health", "--format", "oneline", "--system", "--fail"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
